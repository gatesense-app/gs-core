name: PR Checks

on:
  pull_request:
    branches: [main]
  # Also run on dev pushes: phases land directly on dev, so without this the
  # suite would never actually execute in CI until a release PR opened.
  push:
    branches: [dev]

concurrency:
  # head_ref is empty on push events; fall back to the ref.
  group: pr-checks-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Frontend lint ────────────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  # ── Backend tests ────────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gatesense
          POSTGRES_PASSWORD: gatesense
          POSTGRES_DB: gatesense
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gatesense"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://gatesense:gatesense@localhost:5432/gatesense
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        run: alembic upgrade head

      # Deterministic suite: RLS, tenant/flat scoping, DB-backed tools, fail-safe
      # fallbacks, error shape and rate limits. No Claude API — the live agent
      # tests are opt-in via RUN_AGENT_TESTS, and the eval (backend/eval) is run
      # on demand with its report committed.
      - name: Run tests
        run: python -m pytest backend/tests -v

  # ── Vercel preview deploy ─────────────────────────────────────────────────────
  preview:
    name: Vercel Preview
    runs-on: ubuntu-latest
    needs: [frontend-lint]
    # PRs only: this job comments on the PR, which doesn't exist on a dev push.
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment (preview)
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }} --cwd frontend

      - name: Deploy to Vercel preview
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          URL=$(vercel deploy --token=${{ secrets.VERCEL_TOKEN }} --cwd frontend)
          echo "preview_url=$URL" >> $GITHUB_OUTPUT
          echo "Deployed to: $URL"

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚀 Preview Deployment\n\n**URL:** ${{ steps.deploy.outputs.preview_url }}\n\n> Built from commit \`${{ github.sha }}\``
            })
