name: Deploy to Production

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: gatesense/backend
  ECS_CLUSTER: gatesense-prod-backend
  ECS_SERVICE: gatesense-prod-backend
  ECS_TASK_FAMILY: gatesense-prod-backend

# ── Manual approval gate ───────────────────────────────────────────────────────
# GitHub → Settings → Environments → "production" → add yourself as required reviewer

jobs:
  migrate:
    name: DB Migrations (Prod)
    runs-on: ubuntu-latest
    environment: production  # ← triggers approval gate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Alembic migrations
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: alembic upgrade head

  promote-image:
    name: Promote ECR Image to Prod
    runs-on: ubuntu-latest
    needs: [migrate]
    outputs:
      image_uri: ${{ steps.promote.outputs.image_uri }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Promote staging image to prod tag
        id: promote
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          TAG: ${{ github.ref_name }}
        run: |
          docker pull $REGISTRY/$ECR_REPOSITORY:staging-latest
          docker tag $REGISTRY/$ECR_REPOSITORY:staging-latest $REGISTRY/$ECR_REPOSITORY:prod-$TAG
          docker tag $REGISTRY/$ECR_REPOSITORY:staging-latest $REGISTRY/$ECR_REPOSITORY:prod-latest
          docker push $REGISTRY/$ECR_REPOSITORY:prod-$TAG
          docker push $REGISTRY/$ECR_REPOSITORY:prod-latest
          URI="$REGISTRY/$ECR_REPOSITORY:prod-$TAG"
          echo "image_uri=$URI" >> $GITHUB_OUTPUT
          echo "Promoted: $URI"

  deploy-ecs:
    name: ECS Rolling Deploy (Prod)
    runs-on: ubuntu-latest
    needs: [promote-image]
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_TASK_FAMILY }} \
            --query taskDefinition \
            > task-definition.json

      - name: Update image in task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: backend
          image: ${{ needs.promote-image.outputs.image_uri }}

      - name: Deploy to production ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service:          ${{ env.ECS_SERVICE }}
          cluster:          ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

  deploy-vercel:
    name: Vercel Production Deploy
    runs-on: ubuntu-latest
    needs: [migrate]
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }} --cwd frontend

      - name: Deploy to production
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd frontend

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [deploy-ecs, deploy-vercel]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog from commits
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]' | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --oneline --no-merges | head -20)
          else
            COMMITS=$(git log ${PREV_TAG}..HEAD --oneline --no-merges)
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS"       >> $GITHUB_OUTPUT
          echo "EOF"            >> $GITHUB_OUTPUT

      - name: Create release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              tag_name: '${{ github.ref_name }}',
              name: 'GATESENSE ${{ github.ref_name }}',
              body: `## Changes\n\n\`\`\`\n${{ steps.changelog.outputs.changelog }}\n\`\`\``,
              draft: false,
              prerelease: false,
            })
