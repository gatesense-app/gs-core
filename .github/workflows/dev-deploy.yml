name: Deploy to Dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: dev-deploy
  cancel-in-progress: true  # Latest push wins

jobs:
  # ── 1. Run DB migrations ─────────────────────────────────────────────────────
  migrate:
    name: DB Migrations (Dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Alembic migrations
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: alembic upgrade head

  # ── 2. Deploy frontend ────────────────────────────────────────────────────────
  deploy-vercel:
    name: Vercel Dev Deploy
    runs-on: ubuntu-latest
    needs: [migrate]
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }} --cwd frontend

      - name: Deploy to dev
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --token=${{ secrets.VERCEL_TOKEN }} --cwd frontend

  # ── 3. Summary ────────────────────────────────────────────────────────────────
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [migrate, deploy-vercel]
    if: always()
    steps:
      - name: Deployment summary
        run: |
          echo "## Dev Deployment"
          echo "Commit:  ${{ github.sha }}"
          echo "Migrate: ${{ needs.migrate.result }}"
          echo "Vercel:  ${{ needs.deploy-vercel.result }}"
