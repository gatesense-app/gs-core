name: Deploy (Dev)

# Manual-only for now (workflow_dispatch). Once Railway is provisioned in
# Phase 8, add a `push: { branches: [dev] }` trigger to auto-deploy dev.
# Requires: RAILWAY_TOKEN, DEV_DATABASE_URL, VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
on:
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true # Latest run wins

env:
  RAILWAY_SERVICE: gatesense-backend-dev

jobs:
  migrate:
    name: DB Migrations (Dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Alembic migrations
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: alembic upgrade head

  deploy-backend:
    name: Deploy Backend (Railway dev)
    runs-on: ubuntu-latest
    needs: [migrate]
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service "$RAILWAY_SERVICE" --detach

  deploy-frontend:
    name: Deploy Frontend (Vercel preview)
    runs-on: ubuntu-latest
    needs: [migrate]
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Pull Vercel environment
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }} --cwd frontend
      - name: Deploy to preview
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --token=${{ secrets.VERCEL_TOKEN }} --cwd frontend
